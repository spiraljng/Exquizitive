name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      publish: ${{ steps.resolve.outputs.publish }}
      reason: ${{ steps.resolve.outputs.reason }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          declared="$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ "${version}" != "${declared}" ]]; then
              echo "::error::Tag v${version} does not match package.json (${declared})."
              exit 1
            fi
            publish=true
            reason="tag v${version} was pushed"
          else
            version="${declared}"
            if gh release view "v${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              publish=false
              reason="v${version} is already released"
            else
              publish=true
              reason="package.json is at v${version}, which has no release yet"
            fi
          fi

          echo "${reason}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

  release:
    name: Publish v${{ needs.prepare.outputs.version }}
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      SCRIPT_NAME: Exquizitive
      VERSION: ${{ needs.prepare.outputs.version }}
      GREASYFORK_WEBHOOK: ${{ vars.GREASYFORK_WEBHOOK_URL || 'https://api.greasyfork.org/en/users/1655377-spiraljng/webhook' }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and verify
        run: bun run check

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum "${SCRIPT_NAME}.user.js" "${SCRIPT_NAME}.meta.js" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Exquizitive v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/Exquizitive.user.js
            dist/Exquizitive.meta.js
            dist/SHA256SUMS.txt

      - name: Verify the asset Greasy Fork fetches
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${SCRIPT_NAME}.user.js"
          for attempt in 1 2 3 4 5 6; do
            code="$(curl -sSL -o /tmp/asset.user.js -w '%{http_code}' "$url" || true)"
            if [[ "$code" == "200" ]] && grep -q "==/UserScript==" /tmp/asset.user.js; then
              echo "resolved ${url} (HTTP ${code}, $(wc -c < /tmp/asset.user.js) bytes)"
              exit 0
            fi
            echo "attempt ${attempt}: HTTP ${code}, retrying in 10s"
            sleep 10
          done
          echo "::error::${url} did not resolve to a userscript."
          exit 1

      - name: Greasy Fork handoff
        run: |
          set -euo pipefail
          sync_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/${SCRIPT_NAME}.user.js"
          {
            echo "## Released v${VERSION}"
            echo
            echo "GitHub Release is live and the asset Greasy Fork fetches was verified:"
            echo "\`${sync_url}\`"
            echo
            echo "| Webhook setting | Value |"
            echo "| --- | --- |"
            echo "| Payload URL | \`${GREASYFORK_WEBHOOK}\` |"
            echo "| Content type | \`application/json\` |"
            echo "| Events | \`Releases\` only |"
            echo
            echo "Confirm the new version at <https://greasyfork.org/en/users/1655377-spiraljng>."
          } >> "$GITHUB_STEP_SUMMARY"
